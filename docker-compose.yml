# 운영 스택 — frontend · backend · ingress 3개 서비스.
#
#   docker compose -p skon-prod up -d --build
#   docker compose -p skon-prod down
#
# DB는 이 스택에 포함되지 않는다. 이미 운영 중인 PostgreSQL에 접속하므로
# 접속 정보를 .env로 주입해야 한다 (backend/.env.example 참고).
# 스키마 생성과 시드는 자동으로 일어나지 않는다. 필요하면 사람이 명시적으로:
#
#   docker compose -p skon-prod exec backend uv run --no-dev python -m app.cli check
#   docker compose -p skon-prod exec backend uv run --no-dev python -m app.cli init-db
#   docker compose -p skon-prod exec backend uv run --no-dev python -m app.cli seed

services:
  backend:
    build: ./backend
    environment:
      DB_HOST: ${DB_HOST:?DB_HOST를 .env에 지정하십시오}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:?DB_USER를 .env에 지정하십시오}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 지정하십시오}
      DB_NAME: ${DB_NAME:?DB_NAME을 .env에 지정하십시오}
      DB_SCHEMA: ${DB_SCHEMA:-skon}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET을 .env에 32바이트 이상으로 지정하십시오}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  ingress:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./ingress/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
