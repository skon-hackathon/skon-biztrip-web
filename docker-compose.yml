services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skon}
      POSTGRES_DB: skon
    volumes:
      - skon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skon -d skon"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://skon:${POSTGRES_PASSWORD:-skon}@db:5432/skon
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-set-me}
      SEED_ON_STARTUP: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  ingress:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./ingress/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  skon_pgdata:
