# 운영 스택. 반드시 프로젝트명을 명시해서 실행한다:
#
#   docker compose -p skon-prod up -d --build
#   docker compose -p skon-prod down
#
# 왜 필요한가: 이 저장소에는 compose 파일이 둘(운영/개발) 있고 같은 디렉터리에
# 있어서 기본 프로젝트명이 동일해진다. 두 파일 모두 `db` 서비스를 정의하므로,
# `-p` 없이 실행한 `docker compose down`은 프로젝트 라벨만 보고 개발 DB 컨테이너
# (skon-db-dev)까지 삭제한다. 실제로 한 번 발생했다. 최상위 `name:` 속성으로
# 파일에 고정하는 방법은 이 환경의 Compose v2.0.0이 지원하지 않는다
# ("Additional property name is not allowed"). 따라서 호출 시 -p가 유일한 방어책이다.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skon}
      POSTGRES_DB: skon
    volumes:
      - skon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skon -d skon"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://skon:${POSTGRES_PASSWORD:-skon}@db:5432/skon
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-set-me}
      SEED_ON_STARTUP: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  ingress:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./ingress/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  skon_pgdata:
